version: "2"
output:
  sort-order:
    - linter
    - severity
    - file
linters:
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dupl
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - iface
    - ineffassign
    - makezero
    - misspell
    - mnd
    #- modernize  # disabled: rules/*.go (ruleguard) carry the Go 1.20 through Go 1.27 modernization patterns instead
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    #- nolintlint
    - prealloc
    - predeclared
    - recvcheck
    - revive
    - sloglint
    - staticcheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
  disable:
    - unused
  settings:
    dupl:
      threshold: 120
    gocognit:
      min-complexity: 20
    gocritic:
      disabled-checks:
        - commentFormatting
        - commentedOutCode
      enabled-tags:
        - style
        - diagnostic
        - performance
      settings:
        ruleguard:
          rules: "rules/*.go"
          # A rules file that fails to load (a DSL error, a type string ruleguard
          # cannot parse, or a filter quasigo cannot compile) fails the run
          # instead of being skipped silently (golangci-lint v2.15.0 discards
          # linter log output, pkg/commands/run.go:327-329). gocritic does not
          # run on packages the lint cache already holds, and the cache does not
          # track rules/*.go, so a local run shows such an error only after
          # golangci-lint cache clean. CI lints without a cache.
          failOn: all
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: unused-parameter
          disabled: true
    gosec:
      # Configure gosec for security scanning
      excludes:
        - G104  # Audit errors not checked (covered by errcheck)
      severity: medium
      confidence: medium
    prealloc:
      # Configure prealloc for slice optimization
      simple: true
      range-loops: true
      for-loops: true
    exhaustive:
      # Check exhaustiveness of enum switch statements
      default-signifies-exhaustive: true
  exclusions:
    paths:
      - node_modules
    rules:
      - path: "reports/pdf/"
        linters:
          - mnd
          - gocritic
      - path: "_test\\.go$"
        linters:
          - dupl
          - gocognit
          - goconst
      # autotasktest is a mock-server test-support package; goconst on its
      # mock JSON field names is noise, same rationale as excluding it from tests.
      - path: "autotasktest/"
        linters:
          - goconst
formatters:
  enable:
    - gofmt
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true
  new: false
